name: CI & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python lint tooling
        run: python -m pip install --upgrade pip "ruff==0.15.12"

      - name: Lint Python code
        run: ruff check logic2ableton tests scripts

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build app bundles
        working-directory: app
        run: npm run build

      - name: Check TypeScript and desktop behavior
        working-directory: app
        run: |
          npm run typecheck
          npm test

  test:
    needs: lint
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python tooling
        run: python -m pip install --upgrade pip pytest build

      - name: Run Python tests
        run: python -m pytest tests/ -q

      - name: Build Python package
        run: python -m build

  desktop-smoke:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build standalone converter
        run: pyinstaller logic2ableton.spec

      - name: Smoke test standalone converter
        run: .\dist\logic2ableton.exe --version

      - name: Smoke test conversion lanes
        run: python -m scripts.smoke_standalone dist/logic2ableton.exe

      - name: Copy converter binary to app resources
        run: Copy-Item dist\logic2ableton.exe app\resources\logic2ableton.exe -Force

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build app bundles
        working-directory: app
        run: npm run build

  build:
    needs: [test, desktop-smoke]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            artifact_name: installer-win-x64
            converter_binary: dist/logic2ableton.exe
            smoke_command: .\dist\logic2ableton.exe --version
            electron_override: ""
            mac_min_os_version: ""
            builder_args: ""
          - os: macos-14
            platform: mac
            arch: arm64
            artifact_name: installer-mac-arm64
            converter_binary: dist/logic2ableton
            smoke_command: ./dist/logic2ableton --version
            electron_override: ""
            mac_min_os_version: ""
            builder_args: ""
          # This leg is built, smoke-tested, and packaged entirely on the macos-14 runner
          # above, not on real macOS 11 hardware. Green CI here confirms the artifact was
          # produced with the pinned Electron version and minimumSystemVersion, not that it
          # actually launches on macOS 11 — treat that as unverified until checked by hand.
          - os: macos-14
            platform: mac
            arch: arm64
            artifact_name: installer-mac-arm64-macos11
            converter_binary: dist/logic2ableton
            smoke_command: ./dist/logic2ableton --version
            electron_override: "37.10.3"
            # Passed via a generated electron-builder config file (not -c.mac.minimumSystemVersion=)
            # because yargs coerces "11.0" to the number 11 as a CLI override, dropping the trailing .0.
            mac_min_os_version: "11.0"
            builder_args: "-c.artifactName='${productName}-${version}-${arch}-macos11.${ext}'"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build standalone converter
        run: pyinstaller logic2ableton.spec

      - name: Smoke test standalone converter
        run: ${{ matrix.smoke_command }}

      - name: Smoke test conversion lanes
        run: python -m scripts.smoke_standalone ${{ matrix.converter_binary }}

      - name: Copy converter binary to app resources
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            cp dist/logic2ableton.exe app/resources/logic2ableton.exe
          else
            cp dist/logic2ableton app/resources/logic2ableton
          fi

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Pin legacy Electron for macOS 11
        if: matrix.electron_override != ''
        working-directory: app
        run: |
          npm install --no-save electron@${{ matrix.electron_override }}
          node -p "require('electron/package.json').version"

      - name: Build app bundles
        working-directory: app
        run: npm run build

      - name: Generate macOS icon
        if: matrix.platform == 'mac'
        working-directory: app
        run: npm run prepare:mac-icon

      - name: Build Electron installer
        working-directory: app
        shell: bash
        run: |
          config_file=electron-builder.yml
          if [ -n "${{ matrix.mac_min_os_version }}" ]; then
            # Writing minimumSystemVersion into a YAML config (parsed by js-yaml) keeps it a
            # string. A -c.mac.minimumSystemVersion=11.0 CLI override goes through yargs, which
            # parses "11.0" as the number 11 and silently drops the trailing .0.
            config_file=electron-builder.macos11.yml
            printf 'extends: electron-builder.yml\nmac:\n  minimumSystemVersion: "%s"\n' "${{ matrix.mac_min_os_version }}" > "$config_file"
          fi
          if [ "${{ matrix.platform }}" = "win" ]; then
            npx electron-builder --win --${{ matrix.arch }} --config "$config_file" ${{ matrix.builder_args }}
          else
            npx electron-builder --mac --${{ matrix.arch }} --config "$config_file" ${{ matrix.builder_args }}
          fi

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            app/dist/*.exe
            app/dist/*.dmg

  pypi:
    needs: [test, desktop-smoke]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build Python package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
